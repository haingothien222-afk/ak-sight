<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What did you see?</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--ink:#1b1b18;--red:#c62828;--ok:#2e7d32}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:#fff;color:var(--ink);font-family:"Courier New",Courier,monospace;overflow:hidden;cursor:none;user-select:none;-webkit-user-select:none;touch-action:none}
body.ui{cursor:default}
#hint{position:fixed;left:0;right:0;bottom:calc(24px + env(safe-area-inset-bottom,0px));text-align:center;font-size:14px;color:#777}
#hp{position:fixed;left:16px;top:calc(16px + env(safe-area-inset-top,0px));width:200px;z-index:5;font-size:13px}
#hp .bar{height:12px;border:2px solid var(--ink);margin-top:4px;background:#fff}
#hp .fill{height:100%;width:100%;background:var(--ink);transition:width .25s}
#scope{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .35s;z-index:2;
 background:radial-gradient(circle at var(--x,50%) var(--y,50%),rgba(0,0,0,0) 0,rgba(0,0,0,0) 52px,#000 56px)}
body.aim #scope{opacity:1}
#sight{position:fixed;left:0;top:0;width:120px;height:120px;margin:-60px 0 0 -60px;pointer-events:none;z-index:4;transition:opacity .2s}
#sight svg{width:100%;height:100%;overflow:visible;transition:transform .3s;stroke:var(--ink);fill:none}
body.aim #sight svg{transform:scale(1.35)}
body.aim #sight .ring{stroke:#fff}
body.aim #sight .dot{opacity:0}
body.ui #sight{opacity:0}
@keyframes sway{0%,100%{translate:0 0}25%{translate:3px -2px}50%{translate:-2px 3px}75%{translate:-3px -1px}}
#word{position:absolute;left:50%;top:50%;z-index:3;pointer-events:none;font-size:13px;font-weight:700;color:var(--ink);transform:translate(-50%,-50%) translateY(4px);opacity:0;transition:opacity .15s;white-space:nowrap}
#word.on{opacity:1}
#dlg{position:fixed;z-index:6;width:240px;padding:14px;background:#fff;border:2px solid var(--ink);box-shadow:5px 5px 0 var(--ink);display:none}
#dlg.on{display:block}
#dlg label{display:block;font-weight:700;margin-bottom:8px}
#dlg input{width:100%;box-sizing:border-box;padding:8px;border:2px solid var(--ink);font:inherit;font-size:16px;background:#fff;color:var(--ink);outline:none}
#dlg input:focus{border-color:var(--red)}
button{font:inherit;margin-top:8px;padding:7px 12px;border:2px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer}
#flash{position:fixed;inset:0;pointer-events:none;z-index:7;opacity:0}
#flash.bad{background:rgba(198,40,40,.55);animation:hit .5s ease-out}
#flash.good{background:rgba(46,125,50,.25);animation:hit .5s ease-out}
@keyframes hit{0%{opacity:1}100%{opacity:0}}
body.shake{animation:shake .35s}
@keyframes shake{20%{transform:translate(-8px,4px)}40%{transform:translate(8px,-4px)}60%{transform:translate(-5px,2px)}80%{transform:translate(4px,-2px)}}
#msg{position:fixed;left:0;right:0;top:30%;text-align:center;font-size:22px;font-weight:700;z-index:7;pointer-events:none;opacity:0}
#msg.on{animation:hit 1.2s ease-out}
#over{position:fixed;inset:0;z-index:8;background:rgba(255,255,255,.96);display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}
#over.on{display:flex}
#over h1{margin:0;font-size:40px;color:var(--red)}
#hp.heal .fill{animation:healfill .9s ease-out}
@keyframes healfill{0%,60%{background:#2e7d32;box-shadow:0 0 12px 3px rgba(46,125,50,.8)}100%{background:var(--ink);box-shadow:none}}
#hp.heal #hpt{animation:healtxt .9s}
@keyframes healtxt{0%,60%{color:#2e7d32}100%{color:var(--ink)}}
#hp.heal::after{content:"+10";position:absolute;left:100%;top:0;margin-left:8px;color:#2e7d32;font-weight:700;animation:rise .9s ease-out forwards}
@keyframes rise{from{opacity:1;transform:translateY(8px)}to{opacity:0;transform:translateY(-10px)}}
.w{position:absolute;left:0;top:0;pointer-events:none;font-weight:700;color:var(--ink);transform:translate(-50%,-50%);white-space:nowrap;opacity:0}
body.aim .w{opacity:1;transition:opacity 0s .35s}
.w.scared::after{content:"!";position:absolute;left:100%;top:-10px;margin-left:2px;color:var(--red);font-size:18px}
.w.scared:not(.run){animation:trem .08s linear infinite}
@keyframes trem{0%,100%{margin-top:-1px}50%{margin-top:1px}}
.w.run{filter:blur(1px)}
#stage{position:fixed;inset:0;z-index:1;pointer-events:none;clip-path:circle(52px at var(--x,50%) var(--y,50%))}
body:not(.aim) #stage{visibility:hidden}
body.aim #hp{color:#fff}
body.aim #hp .bar{border-color:#fff;background:#000}
body.aim #hp .fill{background:#fff}
#flash.scare{animation:boo .7s ease-out}
@keyframes boo{0%{background:#fff;opacity:1}30%{background:#c62828;opacity:.9}100%{background:#c62828;opacity:0}}
#pic{position:absolute;left:50%;top:50%;width:132px;height:132px;margin:-66px 0 0 -66px;border-radius:50%;object-fit:cover;border:3px solid var(--red);box-shadow:0 0 30px 8px rgba(198,40,40,.6);display:none;z-index:5;pointer-events:none}
#pic.on{display:block;animation:scare 1.5s ease-out both}
@keyframes scare{0%{transform:scale(.1) rotate(-12deg);filter:brightness(3)}12%{transform:scale(1.5) rotate(6deg);filter:brightness(1.8) contrast(1.3)}25%{transform:scale(1.15) translate(-6px,4px)}40%{transform:scale(1.25) translate(6px,-4px)}55%{transform:scale(1.15) translate(-4px,-3px)}70%{transform:scale(1.2) translate(4px,3px)}100%{transform:scale(1.15)}}
@media (prefers-reduced-motion:reduce){body.aim #sight,body.shake,#pic.on{animation:none}}
</style>
</head>
<body>
<div id="stage"></div>
<div id="hp"><span id="hpt">HP 100 / 100</span><div class="bar"><div class="fill" id="fill"></div></div></div>
<div id="hint">Click chuột trái để ngắm, rồi quét ống ngắm đi tìm các từ ẩn.</div>
<div id="scope"></div>
<div id="sight">
 <svg viewBox="-60 -60 120 120" stroke-width="3">
  <circle class="ring" r="40" stroke-width="2"/>
  <path d="M0 -40V-8" stroke-width="5"/>
  <path d="M-6 -8H6" stroke-width="3"/>
  <path d="M-26 40L-9 16M26 40L9 16M-9 16H9" stroke-width="3"/>
  <circle class="dot" r="1.5" fill="currentColor" style="fill:var(--red);stroke:none"/>
 </svg>
 <div id="word"></div><img id="pic" alt="">
</div>
<div id="dlg">
 <label for="ans">What did you see?</label>
 <input id="ans" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">
 <button id="ok" type="button">Answer</button>
</div>
<div id="msg"></div>
<div id="flash"></div>
<div id="over"><h1>You’re down</h1><div>Health reached 0.</div><button id="again" type="button">Play again</button></div>

var off=0;
function setPos(e){
  off=e.pointerType==="touch"?110:0;
  pos.x=e.clientX;
  pos.y=Math.max(e.clientY-off,off?70:0);
  place();
}
function place(){
  sight.style.transform="translate("+pos.x+"px,"+pos.y+"px)";
  document.documentElement.style.setProperty("--x",pos.x+"px");
  document.documentElement.style.setProperty("--y",pos.y+"px");
}
function setAim(on){aiming=on;body.classList.toggle("aim",on);last={x:pos.x,y:pos.y};$("hint").style.opacity=on?0:1;if(on)startWorld();else clearWorld()}
function heal(){var h=$("hp");h.classList.remove("heal");void h.offsetWidth;h.classList.add("heal")}
function updateHp(){$("hpt").textContent="HP "+hp+" / 100";$("fill").style.width=hp+"%"}
function say(t,c){msg.textContent=t;msg.style.color=c;msg.classList.remove("on");void msg.offsetWidth;msg.classList.add("on")}
function bang(){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    var n=ac.sampleRate*0.18,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);
    for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);
    var s=ac.createBufferSource(),g=ac.createGain();g.gain.value=.5;s.buffer=b;s.connect(g);g.connect(ac.destination);s.start();
  }catch(e){}
}
function pick(){var w;do{w=WORDS[Math.floor(Math.random()*WORDS.length)]}while(w===lastWord);lastWord=w;return w}

function scare(){
  flash.className="";void flash.offsetWidth;flash.className="scare";
  body.classList.remove("shake");void body.offsetWidth;body.classList.add("shake");
  if(navigator.vibrate)navigator.vibrate([150,50,250]);
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    var t=ac.currentTime,o=ac.createOscillator(),o2=ac.createOscillator(),g=ac.createGain();
    o.type="sawtooth";o2.type="square";
    o.frequency.setValueAtTime(180,t);o.frequency.exponentialRampToValueAtTime(1400,t+.15);o.frequency.exponentialRampToValueAtTime(300,t+.7);
    o2.frequency.setValueAtTime(190,t);o2.frequency.exponentialRampToValueAtTime(1500,t+.15);o2.frequency.exponentialRampToValueAtTime(320,t+.7);
    g.gain.setValueAtTime(.35,t);g.gain.exponentialRampToValueAtTime(.001,t+.8);
    o.connect(g);o2.connect(g);g.connect(ac.destination);o.start(t);o2.start(t);o.stop(t+.8);o2.stop(t+.8);
  }catch(e){}
}
var world=[],imgT=null,seen=null,raf=0,prev={x:0,y:0},tl=0;
function rnd(a,b){return a+Math.random()*(b-a)}
function farFrom(list,minD){
  for(var n=0;n<60;n++){
    var x=rnd(70,innerWidth-70),y=rnd(90,innerHeight-90),ok=Math.hypot(x-pos.x,y-pos.y)>minD;
    for(var j=0;j<list.length&&ok;j++)if(Math.hypot(x-list[j].x,y-list[j].y)<130)ok=false;
    if(ok)return{x:x,y:y};
  }
  return{x:rnd(70,innerWidth-70),y:rnd(90,innerHeight-90)};
}
function put(w){w.el.style.left=w.x+"px";w.el.style.top=w.y+"px"}
function segD(px,py){
  var ax=prev.x,ay=prev.y,dx=pos.x-ax,dy=pos.y-ay,l=dx*dx+dy*dy,t=l?Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/l)):0;
  return Math.hypot(px-(ax+t*dx),py-(ay+t*dy));
}
function startWorld(){
  clearWorld();
  var pts=[],used=[];
  for(var i=0;i<5;i++){
    var p=farFrom(pts,150),w;pts.push(p);
    do{w=pick()}while(used.indexOf(w)>-1);used.push(w);
    var el=document.createElement("div");el.className="w";el.textContent=w;
    el.style.fontSize=Math.min(13,Math.floor(88/(w.length*0.6)))+"px";
    $("stage").appendChild(el);
    var o={el:el,x:p.x,y:p.y,t:w,alert:Math.random()<0.5,st:0};
    world.push(o);put(o);
  }
  if(since>=2||Math.random()<0.4){var q=farFrom(pts,150);imgT={x:q.x,y:q.y}}
  prev={x:pos.x,y:pos.y};tl=0;
  raf=requestAnimationFrame(tick);
}
function clearWorld(){
  cancelAnimationFrame(raf);
  world.forEach(function(w){w.el.remove()});
  world=[];imgT=null;seen=null;
  if(!busy)saved=null;
}
function tick(ts){
  if(!aiming||busy)return;
  var dt=Math.min(ts-(tl||ts),50);tl=ts;
  if(imgT&&segD(imgT.x,imgT.y)<48){triggerImage();return}
  for(var i=0;i<world.length;i++){
    var w=world[i];
    if(w.st===0&&!seen&&segD(w.x,w.y)<38){
      w.st=1;seen=w;saved=w.t;w.t0=ts;w.el.classList.add("spot");
      if(w.alert)w.el.classList.add("scared");
      if(navigator.vibrate)navigator.vibrate(30);
    }else if(w.st===1&&w.alert&&ts-w.t0>450){
      var q=farFrom([],260);w.tx=q.x;w.ty=q.y;w.st=2;w.el.classList.add("run");
    }
    if(w.st===2){
      var dx=w.tx-w.x,dy=w.ty-w.y,d=Math.hypot(dx,dy),s=1.1*dt;
      if(d<=s){w.x=w.tx;w.y=w.ty;w.st=3}else{w.x+=dx/d*s;w.y+=dy/d*s}
      put(w);
    }
  }
  if(seen&&Math.hypot(pos.x-seen.x,pos.y-seen.y)>66){finishSpot();return}
  prev={x:pos.x,y:pos.y};
  raf=requestAnimationFrame(tick);
}
function finishSpot(){
  if(!seen)return;
  busy=true;since++;
  openDlg();
}
function triggerImage(){
  busy=true;since=0;
  clearWorld();
  if(!bag.length){bag=IMGS.map(function(_,n){return n}).sort(function(){return Math.random()-.5});if(bag[0]===lastImg)bag.push(bag.shift())}
  var i=bag.shift();lastImg=i;
  saved=IMGS[i].k;pic.src=IMGS[i].s;pic.classList.add("on");
  scare();
  setTimeout(function(){pic.classList.remove("on");openDlg()},1500);
}
function openDlg(){
  busy=true;
  setAim(false);
  body.classList.add("ui");
  dlg.style.left=Math.min(Math.max(pos.x-120,10),innerWidth-250)+"px";
  dlg.style.top=Math.min(Math.max(pos.y-40,10),innerHeight-150)+"px";
  ans.value="";dlg.classList.add("on");ans.focus();
}
function submit(){
  if(!dlg.classList.contains("on"))return;
  var a=ans.value.trim().toLowerCase(),ok=Array.isArray(saved)?saved.indexOf(a)>-1:a===saved;
  saved=null;
  dlg.classList.remove("on");body.classList.remove("ui");busy=false;
  flash.className="";void flash.offsetWidth;
  if(ok){flash.className="good";if(hp<100){hp=Math.min(100,hp+10);updateHp();heal();say("Correct +10 HP","#2e7d32")}else say("Correct","#2e7d32")}
  else{
    bang();flash.className="bad";
    body.classList.remove("shake");void body.offsetWidth;body.classList.add("shake");
    hp=Math.max(0,hp-10);updateHp();say("Shot! −10 HP","#c62828");
    if(hp<=0)setTimeout(function(){$("over").classList.add("on");body.classList.add("ui")},600);
  }
}
addEventListener("pointermove",function(e){
  setPos(e);
});
addEventListener("pointerdown",function(e){
  if(e.button!==0||e.target.closest("#dlg,#over"))return;
  setPos(e);
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(x){}
  if(hp<=0||busy)return;
  if(e.pointerType==="touch")setAim(true);else setAim(!aiming);
});
addEventListener("pointerup",function(e){if(e.pointerType==="touch"&&aiming&&!busy){if(seen)finishSpot();else setAim(false)}});
addEventListener("pointercancel",function(){if(aiming&&!busy)setAim(false)});
$("ok").addEventListener("click",submit);
ans.addEventListener("keydown",function(e){if(e.key==="Enter")submit()});
$("again").addEventListener("click",function(){hp=100;updateHp();$("over").classList.remove("on");body.classList.remove("ui")});
addEventListener("contextmenu",function(e){e.preventDefault()});
IMGS.forEach(function(m){new Image().src=m.s});
if(matchMedia("(pointer:coarse)").matches)$("hint").textContent="Chạm và lướt ngón tay để ngắm. Ống ngắm nằm phía trên ngón tay.";
place();updateHp();
})();
</script>
</body>
</html>
